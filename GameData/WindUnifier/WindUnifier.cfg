// WindUnifier — KWP climate drives NaturalWeather, single FAR wind source.
// Values are tuned in flight; see 方案与可行性评估.md §2.
WINDUNIFIER_CONFIG
{
    enabled = true

    // How strongly KWP's climate sets NaturalWeather's base state.
    // 1.0 would freeze NW's own medium-scale variation; 0.55 keeps it alive.
    weight = 0.55

    // EVE volumetric-cloud column gain: wind *= 1 + eveCloudGain * clamp01(thickness / eveCloudRef)
    // 0 disables. Kept small because NW already has its own cloud/turbulence coupling.
    eveCloudGain = 0.25
    eveCloudRef = 3000

    // Layered caps (m/s). Tornadoes exceed 45 m/s, so background and event are separate.
    maxBackground = 60
    maxTotal = 250

    // KWP ships Kerbin climate data only; injecting zeros on other bodies would halve NW wind.
    onlyKerbin = true

    debugHud = false
}
